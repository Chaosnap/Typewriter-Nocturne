version: 2
updates:
  # Version bumps for GitHub Actions only. npm dependencies receive security updates
  # (Dependabot regenerates pnpm lockfiles in the cloud); routine npm bumps are done
  # deliberately because Electron, node-pty and xterm.js must move together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: main
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: main
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    target-branch: main
    open-pull-requests-limit: 0
