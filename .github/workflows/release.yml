# Publishes a GitHub Release when a version tag (v1.2.3 or v1.2.3-beta.1) is pushed.
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: typewriter-nocturne-*
          path: dist/release
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: rendered-artwork
          path: .

      - name: Checksums and release notes
        run: bin/ci/release-notes.sh "${{ needs.version.outputs.version }}" dist/release > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Typewriter Nocturne ${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            dist/release/*.dmg
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/SHA256SUMS.txt
            dist/release/BUILD-INFO-*.json
            dist/assets/thumbnail-*.png
          fail_on_unmatched_files: false
